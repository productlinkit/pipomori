<!-- HOME -->
<div class="view" id="view-home">
  <header class="hero">
    <div class="leaves" aria-hidden="true">
      <i style="--x:12%;--d:7s;--dl:0s"></i><i style="--x:30%;--d:9s;--dl:2.4s"></i>
      <i style="--x:52%;--d:8s;--dl:1.1s"></i><i style="--x:70%;--d:10s;--dl:3.6s"></i>
      <i style="--x:86%;--d:7.5s;--dl:5s"></i>
    </div>
    <div class="topbar pad">
      <span class="wordmark wm" aria-label="Pipomori"></span>
      <div class="tr">
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="id" aria-pressed="true">ID</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <div class="greet pad">
      <h1 id="greet-title">Selamat pagi, Penjelajah</h1>
      <p data-i18n="greetSub">Hutan Pipomori sudah menunggumu hari ini.</p>
    </div>
  </header>

  <main class="sheet pad">
    <div class="cats" id="cats" role="group" aria-label="Kategori"></div>


    <section class="block">
      <div class="stage">
        <span class="sparkles" aria-hidden="true"><i style="--x:12%;--y:18%;--d:0s;--s:14px"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.9 7.4 7.5 8-4.6.6-6.9 3.4-7.5 8-.6-4.6-2.9-7.4-7.5-8 4.6-.6 6.9-3.4 7.5-8Z" fill="currentColor"/></svg></i><i style="--x:78%;--y:12%;--d:0.7s;--s:18px"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.9 7.4 7.5 8-4.6.6-6.9 3.4-7.5 8-.6-4.6-2.9-7.4-7.5-8 4.6-.6 6.9-3.4 7.5-8Z" fill="currentColor"/></svg></i><i style="--x:88%;--y:52%;--d:1.4s;--s:12px"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.9 7.4 7.5 8-4.6.6-6.9 3.4-7.5 8-.6-4.6-2.9-7.4-7.5-8 4.6-.6 6.9-3.4 7.5-8Z" fill="currentColor"/></svg></i><i style="--x:24%;--y:64%;--d:2.1s;--s:10px"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.9 7.4 7.5 8-4.6.6-6.9 3.4-7.5 8-.6-4.6-2.9-7.4-7.5-8 4.6-.6 6.9-3.4 7.5-8Z" fill="currentColor"/></svg></i><i style="--x:56%;--y:30%;--d:1.1s;--s:9px"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.9 7.4 7.5 8-4.6.6-6.9 3.4-7.5 8-.6-4.6-2.9-7.4-7.5-8 4.6-.6 6.9-3.4 7.5-8Z" fill="currentColor"/></svg></i></span>
        <div class="head">
          <span class="ttl"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-8" stroke="#3d7a22" stroke-width="2.6" stroke-linecap="round"/><path d="M12 14C12 8 8 5 3 6c0 5 4 8 9 8Z" fill="#6cb33c"/><path d="M12 13c0-5 3.5-8 9-7 0 5-3.5 7-9 7Z" fill="#8fd05a"/></svg><h2 data-i18n="trending">Lagi Ramai Dimainkan</h2></span>
          <span class="live-pill"><i></i><span id="live-count">5,8 rb</span></span>
        </div>
        <div class="deck" id="deck" role="group" aria-roledescription="carousel"></div>
      </div>
    </section>

    <section class="block">
      <div class="head"><span class="ttl"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-8" stroke="#3d7a22" stroke-width="2.6" stroke-linecap="round"/><path d="M12 14C12 8 8 5 3 6c0 5 4 8 9 8Z" fill="#6cb33c"/><path d="M12 13c0-5 3.5-8 9-7 0 5-3.5 7-9 7Z" fill="#8fd05a"/></svg><h2 data-i18n="event">Event Minggu Ini</h2></span></div>
      <div class="ticket">
        <div class="t-art" role="img" aria-label="Kiko"></div>
        <div class="t-body">
          <span class="tag" data-i18n="eventTag">20–26 Okt</span>
          <h3 data-i18n="eventTitle">Festival Kiko</h3>
          <span class="cd-label" id="cd-label"></span>
          <div class="cd" id="cd">
            <span><b id="cd-d">0</b><small data-i18n="days">Hari</small></span>
            <span><b id="cd-h">0</b><small data-i18n="hours">Jam</small></span>
            <span><b id="cd-m">0</b><small data-i18n="mins">Menit</small></span>
          </div>
          <button type="button" class="t-cta shine" id="event-btn" aria-pressed="false" data-i18n="joinEvent">Ikut Event</button>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="head">
        <span class="ttl"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-8" stroke="#3d7a22" stroke-width="2.6" stroke-linecap="round"/><path d="M12 14C12 8 8 5 3 6c0 5 4 8 9 8Z" fill="#6cb33c"/><path d="M12 13c0-5 3.5-8 9-7 0 5-3.5 7-9 7Z" fill="#8fd05a"/></svg><h2 id="grid-title">Rekomendasi</h2></span>
        <button type="button" class="more" id="see-all"><span data-i18n="seeAll">Lihat semua</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div id="feature"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>
