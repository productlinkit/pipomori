<!-- GAMES -->
<div class="view" id="view-games" hidden>
  <header class="hero small" style="background-image:url('assets/puru-surf.jpg')">
    <div class="topbar pad">
      <span class="wordmark wm" aria-label="Pipomori"></span>
      <div class="tr">
        <div class="lang" role="group" aria-label="Bahasa / Language">
          <button type="button" data-lang="id" aria-pressed="true">ID</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <div class="greet pad">
      <h1 data-i18n="gamesTitle">Semua Game</h1>
      <p id="games-sub"></p>
    </div>
  </header>
  <main class="sheet pad">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="Cari nama game">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Kategori"></div>
    <div class="sortbar">
      <span id="result-count"></span>
      <div class="seg" role="group" aria-label="Urutkan" id="sort">
        <button type="button" data-sort="popular" aria-pressed="true" data-i18n="sortPopular">Populer</button>
        <button type="button" data-sort="new" aria-pressed="false" data-i18n="sortNew">Terbaru</button>
        <button type="button" data-sort="az" aria-pressed="false">A–Z</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>
